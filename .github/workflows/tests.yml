name: tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest
      - name: pi_bridge 문법 확인 (Pi는 표준 라이브러리만 사용)
        run: python -m py_compile tools/pi_bridge.py tools/simulate.py tools/make_qr.py deploy/pythonanywhere_deploy.py
