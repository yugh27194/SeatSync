name: pages

# pages/ 폴더(SeatSync 소개 페이지)를 GitHub Pages로 배포한다.
# 처음 한 번: 저장소 Settings → Pages → Source 를 "GitHub Actions"로 바꿔야 한다.
on:
  push:
    branches: [main, master, claude/website-implementation-vhqkdd]
    paths: ["pages/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages
      - id: deployment
        uses: actions/deploy-pages@v4
